name: export-active-round-test
on:
  push:
    paths:
      - ".github/workflows/export-active-round-test.yml"
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: active-round-test
          path: active-round-test.html
          if-no-files-found: error
          retention-days: 1
