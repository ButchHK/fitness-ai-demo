<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f0f5fb">
  <title>Магазин • продажи — демо</title>
  <style>
    :root { --blue:#2586d5;--blue-dark:#146bb7;--ink:#1c2a3a;--muted:#728196;--line:#dce5ed;--paper:#fff;--wash:#f2f6fa;--good:#138b65;--goodbg:#e6f7ee;--shadow:0 14px 60px #1c314638; }
    * { box-sizing:border-box; }
    html,body { margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink); }
    body { display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 15% 15%,#f9fcff 0,transparent 35%),linear-gradient(140deg,#dce8f3,#cbd9e5 80%); }
    button,input,textarea,select {font:inherit;} button {cursor:pointer;} button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #79c2f7;outline-offset:2px}
    .phone { position:relative;display:flex;flex-direction:column;flex-shrink:0;width:408px;max-width:100%;height:min(878px,calc(100dvh - 36px));border:1px solid #cad5de;border-radius:31px;background:#fff;overflow:hidden;box-shadow:var(--shadow); }
    .status {height:28px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:8px 23px 0;background:#fff;font-size:12px;font-weight:750;color:#273d52;letter-spacing:.15px}
    .status .symbols{letter-spacing:2px;font-size:11px}
    .topbar{height:65px;flex-shrink:0;display:flex;align-items:center;gap:11px;padding:10px 15px;background:#fff;border-bottom:1px solid var(--line)}
    .avatar{display:grid;place-items:center;width:42px;height:42px;flex:none;border-radius:50%;background:linear-gradient(135deg,#69b8f4,#207ac9);color:white;font-size:22px}
    .identity{flex:1;min-width:0}.identity strong{display:block;font-size:15px;font-weight:800;letter-spacing:-.2px}.identity span{display:block;color:#3597d9;font-size:12px;margin-top:2px}
    .icon-btn {height:38px;width:38px;border:1px solid #e5edf3;border-radius:13px;background:#f4f8fb;display:grid;place-items:center;color:#42728f;flex:none}
    .icon-btn svg {width:19px;height:19px}
    .screen {flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:var(--wash);scrollbar-width:thin;scrollbar-color:#c5d1dd transparent}
    .screen-inner {padding:16px 15px 25px;}
    .bottom-nav {flex-shrink:0;display:none;grid-template-columns:repeat(4,1fr);padding:8px 8px max(9px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);z-index:5}
    .nav-btn {border:0;background:transparent;color:#7d8a9a;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:51px;padding:7px 1px 3px;font-weight:700;font-size:10.5px;border-radius:11px;transition:background .12s}
    .nav-btn svg{width:22px;height:22px;stroke-width:1.9}.nav-btn.active{background:#eaf5fe;color:var(--blue-dark)}
    .kicker{display:inline-flex;align-items:center;gap:6px;color:var(--blue-dark);font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:1px}
    h1,h2,h3,p{margin-top:0}h1{font-size:22px;line-height:1.2;letter-spacing:-.7px;margin:8px 0 6px} h2{font-size:17px;letter-spacing:-.35px;margin:0} h3{font-size:14px;margin:0} p{font-size:13px;color:#728196;line-height:1.48;margin-bottom:14px}
    .subtitle {font-size:12px;margin:5px 0 0;color:var(--muted);line-height:1.4}
    .row {display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:11px}
    .card{border:1px solid #e4ebf1;background:white;border-radius:19px;padding:15px;box-shadow:0 3px 12px #27476308}.card-tight{padding:12px 13px}
    .card-head {display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
    .chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #dae4ec;background:#fff;border-radius:12px;padding:10px 9px;min-height:43px;font-size:12px;font-weight:700;color:#364b60;white-space:nowrap;transition:.13s}
    .chip.active{background:#e6f3ff;border-color:#58a8e6;color:#156ab2;box-shadow:inset 0 0 0 1px #83c5f4}
    .chip:active,.btn:active,.key:active{transform:scale(.98)}
    .cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cat-grid .chip{display:flex;flex-direction:column;gap:5px;min-height:71px;white-space:normal}.cat-icon{font-size:24px;line-height:1}
    .size-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.size-grid .chip{padding:10px 0;min-height:42px;font-size:12px}.size-grid .wide{grid-column:span 2}.size-grid .xwide{grid-column:span 3}
    .form-label{font-size:12px;color:#53667a;font-weight:800;display:block;margin-bottom:7px}
    .field-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;font-size:12px;font-weight:800;color:#53667a}
    .field-label small{font-size:10px;font-weight:600;color:#9ba8b5}
    .field{display:flex;align-items:center;background:#f8fafc;border:1px solid #dbe5ed;border-radius:13px;padding:0 13px;height:48px;gap:7px}
    .field:focus-within{border-color:#53a7e4;background:#fff;box-shadow:0 0 0 3px #77bcef25}.field input{width:100%;border:0;outline:0;background:transparent;font-size:17px;font-weight:750;color:var(--ink);min-width:0}.field .suffix{font-size:13px;color:#94a4b4;font-weight:700}
    textarea{resize:vertical;min-height:62px;width:100%;border:1px solid #dbe5ed;background:#f8fafc;border-radius:13px;padding:12px;font-size:13px;outline:0;color:var(--ink)}
    .two-inputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .btn{min-height:48px;border:0;border-radius:13px;background:var(--blue);color:#fff;font-weight:800;font-size:14px;padding:12px 15px;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;transition:.12s;box-shadow:0 3px 8px #2486d525}
    .btn:hover{background:var(--blue-dark)}.btn.secondary{background:#e9f1f7;color:#406580;box-shadow:none}.btn.good{background:#168c65}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.small{width:auto;min-height:36px;font-size:12px;padding:8px 12px}
    .hint{font-size:11px;line-height:1.5;color:#8291a0}.tiny{font-size:11px;color:var(--muted)}
    .summary-strip{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid #dde9f1;border-radius:13px;background:#fff;margin-bottom:14px}
    .summary-strip strong{font-size:14px}.summary-strip span{font-size:11px;color:var(--muted)}
    .live-preview{border:1px solid #d5ebe1;background:linear-gradient(120deg,#effbf5,#e4f7ee);border-radius:16px;padding:12px 13px}
    .metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.metric{padding:4px 0}.metric small{display:block;color:#637e73;font-size:10.5px;margin-bottom:3px}.metric strong{font-size:19px;letter-spacing:-.5px}.metric.negative strong{color:#bd4c53}.metric.positive strong{color:var(--good)}
    .warn{background:#fff1e5;border:1px solid #f3d4b4;border-radius:12px;padding:10px 12px;color:#a05b2b;font-size:12px;margin-top:10px}
    .section-title{font-size:12px;font-weight:850;color:#506478;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
    .section-title .light{font-weight:550;color:#92a1b0}
    .pill{font-size:10px;border-radius:999px;padding:5px 9px;font-weight:750;color:#53778f;background:#ecf4fa}
    .step-dots{display:flex;gap:5px;margin:8px 0 15px}.step-dots i{display:block;height:4px;flex:1;background:#dce5ec;border-radius:9px}.step-dots i.on{background:#44a3e6}
    .chat-scene{min-height:100%;background-color:#eaf1eb;background-image:radial-gradient(#d3e0dc 1px,transparent 1px);background-size:16px 16px;padding:13px 11px 22px}
    .date-bubble{width:max-content;margin:0 auto 16px;background:#bacdc9b8;color:#fff;padding:6px 12px;font-weight:700;font-size:11px;border-radius:9px}
    .message{max-width:89%;border-radius:16px;padding:11px 12px 9px;margin:8px 0;box-shadow:0 1px 2px #304e470b;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
    .message.bot{background:#fff;border-top-left-radius:5px}.message.user{background:#d4f6c8;border-top-right-radius:5px;margin-left:auto}
    .message .mtime{font-size:9px;color:#91a7a0;display:block;text-align:right;margin-top:3px}
    .chat-controls{background:#fff;border-radius:17px;padding:13px;margin:11px 0 0;box-shadow:0 5px 20px #58765c24}
    .chat-controls .cat-grid{gap:6px}.chat-controls .cat-grid .chip{min-height:64px}.chat-controls .cat-icon{font-size:21px}
    .chat-actions{display:flex;gap:7px;margin-top:12px}.chat-actions .btn{min-height:43px}
    .chat-composer{display:flex;align-items:center;gap:8px}.chat-composer .field{flex:1}
    .chat-input-hint{margin:5px 0 0;font-size:10.5px;color:#7e8b9b}
    .cash-screen{padding-top:11px;padding-bottom:14px}
    .cash-heading{margin-bottom:9px}.cash-heading h1{font-size:19px;margin:3px 0 0}.cash-heading .linkbtn{background:#e2eef8;border-radius:9px;padding:9px;font-size:11px}
    .cash-screen .card-tight{padding:10px 11px}.cash-screen .section-title{margin-bottom:7px}
    .cash-screen .keypad{gap:5px;margin:8px 0}.cash-screen .key{height:39px}
    .cash-screen .price-slots .slot{padding:7px}.cash-screen .price-slots .slot span{margin-bottom:4px}
    .cash-screen .cash-size-grid{grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
    .cash-screen .cash-size-grid .chip{padding:5px 0;min-height:34px;font-size:10px;letter-spacing:-.15px}
    .cash-screen .cash-size-grid .chip.long{grid-column:span 1}
    .cash-screen .cash-size-grid .chip:nth-last-child(2){grid-column:span 2}
    .cash-screen .cash-preview{padding:7px 11px}
    .cash-screen .btn.good{min-height:42px;padding:9px}
    .cash-cats{display:flex;overflow:auto;gap:7px;scrollbar-width:none;padding:2px 0 8px;margin-bottom:2px}.cash-cats::-webkit-scrollbar{display:none}.cash-cats .chip{flex:none;min-height:38px}
    .cash-size-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.cash-size-grid .chip{font-size:11px;border-radius:9px;min-height:35px;padding:6px 0}.cash-size-grid .long{grid-column:span 2}
    .price-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
    .slot{background:white;border:1.5px solid #d9e5ed;border-radius:12px;text-align:left;padding:9px 7px;min-width:0;color:var(--ink)}.slot.active{border-color:#288fdd;background:#eaf6ff}.slot span{display:block;font-size:10px;color:#7b8a98;margin-bottom:6px}.slot strong{font-size:15px;white-space:nowrap;letter-spacing:-.6px}
    .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.key{height:45px;border:1px solid #dce6ed;border-radius:12px;background:#fff;font-size:21px;color:#344e64;font-weight:650;box-shadow:0 2px 2px #2c587209}.key.special{background:#e5f1fa;color:#1b76bb;font-size:18px}.key.primary{background:#cfeafd;color:#0968af}
    .cash-preview{display:flex;align-items:center;justify-content:space-between;border-radius:14px;padding:11px 13px;background:#e3f5eb;border:1px solid #cfebda;gap:10px}.cash-preview b{font-size:18px;color:#0b865b}.cash-preview small{font-size:11px;color:#66917b}
    .step-marker{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#7b8ca0;margin-bottom:10px;font-weight:700}
    .progress-track{height:5px;background:#dbe6ed;border-radius:8px;margin-bottom:18px;overflow:hidden}.progress-fill{height:100%;background:#2e97e0;transition:width .2s}
    .hybrid-hero{background:linear-gradient(135deg,#2a95d9,#1478c0);color:#fff;border-radius:18px;padding:16px;position:relative;overflow:hidden;margin-bottom:14px}
    .hybrid-hero:after{content:'◌';position:absolute;right:12px;bottom:-40px;font-size:138px;opacity:.12}.hybrid-hero small{color:#cde9fe}.hybrid-hero h2{margin:4px 0 5px;font-size:21px}
    .demo-foot{margin-top:12px;font-size:10px;color:#8795a6;text-align:center;line-height:1.45}
    .sheet-backdrop{position:absolute;inset:0;background:#13273f85;z-index:20;display:flex;align-items:flex-end;justify-content:center}
    .sheet{background:#f5f8fb;border-radius:24px 24px 0 0;width:100%;max-height:91%;display:flex;flex-direction:column;box-shadow:0 -5px 30px #1e36402c;overflow:hidden;animation:slide .18s ease}
    @keyframes slide{from{transform:translateY(35px);opacity:.7}to{transform:translateY(0);opacity:1}}
    .sheet-head{padding:17px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff}
    .sheet-content{overflow-y:auto;padding:14px 14px 30px;scrollbar-width:thin}.sheet-tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:0 14px;padding:4px;border-radius:11px;background:#e8f0f6}
    .sheet-tab{border:0;background:transparent;border-radius:9px;padding:9px;font-size:12px;color:#658096;font-weight:750}.sheet-tab.active{background:white;color:#176eb0;box-shadow:0 1px 5px #1d4d7019}
    .sale-item{border:1px solid #e1e9ef;background:#fff;border-radius:14px;padding:13px;margin-bottom:9px}.sale-item .main-line{display:flex;justify-content:space-between;align-items:flex-start;gap:7px}.sale-item strong{font-size:13px}.sale-item .amount{font-size:15px;color:#186aa9;font-weight:850}.sale-item .sub{font-size:11px;color:#8291a0;margin-top:7px;line-height:1.5}.item-actions{display:flex;gap:7px;margin-top:11px}.item-actions button{background:#f1f5f9;border:1px solid #e2e9ef;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:750;color:#56748c}.item-actions .danger{color:#c65462}
    .sheet .field{height:43px}.edit-grid{display:grid;gap:11px}
    .empty{border:1px dashed #ccd9e4;border-radius:16px;text-align:center;padding:28px 14px;color:#8c9aaa;font-size:13px}
    .toast{position:absolute;bottom:20px;left:18px;right:18px;z-index:60;background:#24394d;color:#fff;padding:13px 16px;border-radius:13px;box-shadow:0 8px 20px #0003;font-size:13px;text-align:center;font-weight:700;animation:slide .15s ease}
    .mini-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}.mini-summary .stat{padding:14px;background:#fff;border:1px solid #e4eaf0;border-radius:13px}.mini-summary .stat small{display:block;color:#8495a5;font-size:11px;margin-bottom:4px}.mini-summary .stat strong{display:block;font-size:20px;letter-spacing:-.55px}
    .linkbtn{border:0;background:transparent;color:#287fc0;font-size:12px;font-weight:750;padding:7px}
    @media(max-width:460px){ body{padding:0;background:#fff}.phone{width:100%;max-width:408px;height:100dvh;border:0;border-radius:0;box-shadow:none}.status{padding-top:7px} }
    @media(max-height:740px){.screen-inner{padding-bottom:15px}.cat-grid .chip{min-height:62px}.key{height:42px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<div class="phone" id="phone">
  <main class="screen" id="screen"></main>
  <nav class="bottom-nav" aria-label="Переключение интерфейсов">
    <button class="nav-btn active" data-tab="chat" aria-label="Пошаговый чат"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v12H9l-5 4V5z"/></svg><span>Чат</span></button>
    <button class="nav-btn" data-tab="form" aria-label="Общая форма"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Форма</span></button>
    <button class="nav-btn" data-tab="cash" aria-label="Кассовый ввод"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8v3H8zM8 14h1m3 0h1m3 0h1m-9 3h1m3 0h1m3 0h1"/></svg><span>Касса</span></button>
    <button class="nav-btn" data-tab="hybrid" aria-label="Гибридный интерфейс"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="18" height="8" rx="2"/></svg><span>Гибрид</span></button>
  </nav>
  <div id="sheetRoot"></div><div id="toastRoot"></div>
</div>
<script>
(()=>{'use strict';
const CATS=[['dress','👗','Платье'],['blouse','👚','Блузка'],['pants','👖','Брюки'],['suit','🧥','Костюм'],['skirt','🩰','Юбка'],['other','🛍','Другое']];
const SIZES=['42','44','46','48','50','52','54','56','58','60','48–50','One Size','—'];
const KEY='sales-bot-interface-lab-v1';
const emptyDraft=()=>({category:'',size:'',cost:'',tag:'',discount:'0',note:''});
const els={screen:document.getElementById('screen'),sheet:document.getElementById('sheetRoot'),toast:document.getElementById('toastRoot')};
let db;
try {const val=localStorage.getItem(KEY);db=val?JSON.parse(val):null;}catch(e) {db=null;}
function seed(){const now=new Date();const at=(mins)=>new Date(now.getTime()-mins*60000).toISOString();return [{id:'demo1',category:'dress',size:'48',cost:1500,tag:2800,discount:200,note:'',at:at(105),demo:true},{id:'demo2',category:'blouse',size:'46',cost:900,tag:1800,discount:0,note:'',at:at(42),demo:true},{id:'demo3',category:'pants',size:'50',cost:1300,tag:2400,discount:100,note:'',at:at(8),demo:true}]}
let sales=Array.isArray(db?.sales)?db.sales:seed();
const initialMode=new URLSearchParams(location.search).get('mode');
const st={tab:['chat','form','cash','hybrid'].includes(initialMode)?initialMode:'hybrid',sheet:'',sheetTab:'overview',editing:'',chatStep:0,chatLog:[],chatDraft:emptyDraft(),formDraft:emptyDraft(),cashDraft:emptyDraft(),hybridDraft:emptyDraft(),cashField:'cost',hybridStep:0};
const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(n)||0)+' ₽';
const safe=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const cat=id=>CATS.find(c=>c[0]===id)||['other','🛍','Другое'];
const num=s=>{const raw=String(s??'').replace(/\s/g,'').replace(',','.');if(raw===''||raw==='.')return NaN;const n=Number(raw);return Number.isFinite(n)?n:NaN};
const nowTime=()=>new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
const dayKey=d=>{const dt=new Date(d);return [dt.getFullYear(),dt.getMonth(),dt.getDate()].join('-')};
const today=()=>sales.filter(s=>dayKey(s.at)===dayKey(new Date()));
const totals=arr=>arr.reduce((a,s)=>{a.count++;a.revenue+=s.tag-s.discount;a.cost+=s.cost;a.discount+=s.discount;return a},{count:0,revenue:0,cost:0,discount:0});
function persist(){try{localStorage.setItem(KEY,JSON.stringify({sales}));}catch(e){}}
function toast(t){els.toast.innerHTML=`<div class="toast" role="status">${safe(t)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>els.toast.replaceChildren(),2400)}
function summaryBar(){const t=totals(today());const word=t.count%10===1&&t.count%100!==11?'продажа':t.count%10>=2&&t.count%10<=4&&(t.count%100<12||t.count%100>14)?'продажи':'продаж';return `<div class="summary-strip"><div><span>Сегодня · ${t.count} ${word}</span><br><strong>${fmt(t.revenue)}</strong></div><button class="linkbtn" data-action="stats" type="button">Журнал →</button></div>`}
function catButtons(d,action='select-cat',klass='cat-grid'){return `<div class="${klass}">${CATS.map(c=>`<button type="button" class="chip ${d.category===c[0]?'active':''}" data-action="${action}" data-value="${c[0]}"><span class="cat-icon">${c[1]}</span>${c[2]}</button>`).join('')}</div>`}
function sizeButtons(d,action='select-size',klass='size-grid'){return `<div class="${klass}">${SIZES.map(s=>`<button type="button" class="chip ${d.size===s?'active':''} ${s==='One Size'||s==='48–50'?'wide':''} ${s==='—'?'wide':''}" data-action="${action}" data-value="${safe(s)}">${s==='—'?'Нет':safe(s)}</button>`).join('')}</div>`}
function textField(label,key,d,placeholder='0',opts={}){return `<label class="field-label" for="${opts.prefix||'f'}-${key}">${label}${opts.optional?'<small>необязательно</small>':''}</label><div class="field"><input id="${opts.prefix||'f'}-${key}" data-field="${key}" inputmode="decimal" type="text" autocomplete="off" placeholder="${placeholder}" value="${safe(d[key])}"><span class="suffix">₽</span></div>`}
function computed(d){const a=num(d.cost),b=num(d.tag),c=num(d.discount);return {net:b-c,profit:b-c-a,valid:Number.isFinite(a)&&Number.isFinite(b)&&Number.isFinite(c)&&a>=0&&b>0&&c>=0&&c<=b,error:!Number.isFinite(a)||a<0?'Укажите корректную закупочную цену':!Number.isFinite(b)||b<=0?'Укажите цену на ценнике':!Number.isFinite(c)||c<0?'Скидка должна быть числом от 0':c>b?'Скидка больше цены на ценнике':''}}
function preview(d){const c=computed(d);return `<div class="live-preview" data-preview="1"><div class="section-title" style="color:#3e7561;margin-bottom:6px">Расчёт продажи <span class="light">после скидки</span></div><div class="metrics"><div class="metric"><small>Покупатель заплатит</small><strong>${Number.isFinite(c.net)?fmt(c.net):'—'}</strong></div><div class="metric ${c.profit<0?'negative':'positive'}"><small>Валовая прибыль</small><strong>${Number.isFinite(c.profit)?fmt(c.profit):'—'}</strong></div></div>${c.error&&!(d.cost===''&&d.tag==='')?`<div class="warn">${safe(c.error)}</div>`:''}</div>`}
function validate(d){if(!d.category)return 'Выберите категорию товара';if(!d.size)return 'Выберите размер или «Нет»';const c=computed(d);return c.error||''}
function saveSale(d,source){const problem=validate(d);if(problem){toast('⚠️ '+problem);return false}sales.unshift({id:'s'+Date.now()+Math.random().toString(36).slice(2),category:d.category,size:d.size,cost:num(d.cost),tag:num(d.tag),discount:num(d.discount),note:String(d.note||'').trim(),at:new Date().toISOString(),demo:false,source});persist();toast('✓ Продажа добавлена в демо-журнал');return true}
function intro(k,title,desc){return `<div class="kicker">${k}</div><h1>${title}</h1><p>${desc}</p>`}
function screenMarkup(){if(st.tab==='chat')return renderChat();if(st.tab==='form')return renderForm();if(st.tab==='cash')return renderCash();return renderHybrid()}
function render(){const old=els.screen.scrollTop;els.screen.innerHTML=screenMarkup();els.screen.scrollTop=st.tab==='chat'?els.screen.scrollHeight:old;document.querySelectorAll('.nav-btn').forEach(b=>{b.classList.toggle('active',b.dataset.tab===st.tab);b.setAttribute('aria-current',b.dataset.tab===st.tab?'page':'false')})}
function renderChat(){const questions=['Что продали? Выберите категорию 👇','Какой размер?','Сколько стоил товар при закупке?','Какая цена указана на ценнике?','Сколько рублей составила скидка?','Добавим комментарий или сразу запишем продажу?'];const d=st.chatDraft;let control='';const step=st.chatStep;
if(step===0)control=catButtons(d,'chat-cat');
else if(step===1)control=sizeButtons(d,'chat-size');
else if(step<=4){const field=['','','cost','tag','discount'][step];const labels={cost:'Закупка, ₽',tag:'Цена на ценнике, ₽',discount:'Скидка, ₽'};control=`<div class="chat-composer"><div class="field"><input id="chatValue" inputmode="decimal" autocomplete="off" placeholder="${labels[field]}" value="${safe(d[field])}"><span class="suffix">₽</span></div><button type="button" class="btn small" data-action="chat-send">→</button></div>${step===4?'<button type="button" class="linkbtn" data-action="chat-no-discount" style="margin-top:7px">Без скидки · 0 ₽</button>':''}`}
else if(step===5)control=`<div class="row" style="margin-bottom:10px"><span class="tiny">${cat(d.category)[1]} ${cat(d.category)[2]} · ${safe(d.size)}</span><strong>${fmt(num(d.tag)-num(d.discount))}</strong></div><textarea id="chatNote" placeholder="Комментарий необязателен">${safe(d.note)}</textarea><div class="chat-actions"><button class="btn good" data-action="chat-note">✓ Записать</button></div>`;
else control=`<div class="stack" style="gap:8px"><div class="tiny">${cat(d.category)[1]} ${cat(d.category)[2]} · ${safe(d.size)}</div><div class="row"><span class="tiny">Цена после скидки</span><strong>${fmt(num(d.tag)-num(d.discount))}</strong></div><div class="row"><span class="tiny">Закупка</span><strong>${fmt(d.cost)}</strong></div><div class="row"><span class="tiny">Валовая прибыль</span><strong style="color:#11855e">${fmt(num(d.tag)-num(d.discount)-num(d.cost))}</strong></div><button class="btn good" data-action="chat-save">✓ Записать продажу</button></div>`;
return `<div class="chat-scene"><div class="date-bubble">Сегодня · демо</div>${st.chatLog.length===0?'<div class="message bot">Привет! 👋 Запишем продажу. Я буду задавать вопросы по одному.<span class="mtime">демо</span></div>':''}${st.chatLog.map(m=>`<div class="message ${m.role}">${safe(m.text)}<span class="mtime">${safe(m.time)}</span></div>`).join('')}<div class="message bot">${questions[step]}<span class="mtime">${nowTime()}</span></div><div class="chat-controls">${control}<div class="chat-actions">${step>0?'<button class="btn secondary" data-action="chat-back">← Назад</button>':''}<button class="btn secondary" data-action="chat-reset">Начать заново</button></div></div><div class="demo-foot">Сценарий 1 · вопросы по одному, как в обычном Telegram-боте</div></div>`}
function renderForm(){const d=st.formDraft;return `<div class="screen-inner">${intro('Вариант 02 / 04','Всё на одном экране','Одна форма без переходов. Можно заполнить поля в любом порядке.')}${summaryBar()}<div class="card stack"><div><div class="section-title">Категория товара</div>${catButtons(d)}</div><div><div class="section-title">Размер <span class="light">включая «Нет»</span></div>${sizeButtons(d)}</div><div class="two-inputs"><div>${textField('Закупка','cost',d,'1500')}</div><div>${textField('Цена на ценнике','tag',d,'2800')}</div></div><div>${textField('Скидка, ₽','discount',d,'0',{optional:true})}</div><div><label class="form-label" for="note">Комментарий (необязательно)</label><textarea data-field="note" id="note" placeholder="Можно оставить пустым">${safe(d.note)}</textarea></div><div id="formPreview">${preview(d)}</div><button class="btn good" data-action="form-save">✓ Сохранить продажу</button></div><div class="demo-foot">Сценарий 2 · удобно сравнивать заполнение с клавиатуры телефона</div></div>`}
function renderCash(){const d=st.cashDraft;const c=computed(d);const slots=[['cost','Закупка'],['tag','На ценнике'],['discount','Скидка']];return `<div class="screen-inner cash-screen"><div class="row cash-heading"><div><div class="kicker">Вариант 03 / 04</div><h1>Быстрая касса</h1></div><button class="linkbtn" data-action="stats">Итоги дня →</button></div><div class="card card-tight" style="margin-bottom:10px"><div class="section-title">Что продали?</div>${catButtons(d,'select-cat','cash-cats')}<div class="section-title" style="margin-top:4px">Размер</div>${sizeButtons(d,'select-size','cash-size-grid')}</div><div class="card card-tight"><div class="section-title">Цены · нажмите на нужное поле</div><div class="price-slots">${slots.map(([k,l])=>`<button type="button" class="slot ${st.cashField===k?'active':''}" data-action="cash-field" data-value="${k}"><span>${l}</span><strong>${d[k]===''?'—':safe(d[k])} ₽</strong></button>`).join('')}</div><div class="keypad">${['1','2','3','4','5','6','7','8','9','C','0','⌫'].map(n=>`<button type="button" data-action="cash-key" data-value="${n}" class="key ${['C','⌫'].includes(n)?'special':''}">${n}</button>`).join('')}</div><div class="row" style="gap:7px;margin-bottom:11px"><button type="button" class="btn secondary small" data-action="cash-key" data-value=",">, дробная</button><button type="button" class="btn secondary small" data-action="cash-next">Следующее поле →</button></div><div class="cash-preview"><div><small>Покупатель заплатит</small><br><strong>${Number.isFinite(c.net)?fmt(c.net):'—'}</strong></div><div style="text-align:right"><small>Валовая прибыль</small><br><b style="${c.profit<0?'color:#b3424a':''}">${Number.isFinite(c.profit)?fmt(c.profit):'—'}</b></div></div><button class="btn good" style="margin-top:12px" data-action="cash-save">✓ Записать продажу</button></div><div class="demo-foot">Сценарий 3 · проверка ввода только нажатием кнопок</div></div>`}
function renderHybrid(){const d=st.hybridDraft;const stage=st.hybridStep;return `<div class="screen-inner">${summaryBar()}<div class="step-marker"><span>Шаг ${stage+1} из 2</span><span>${stage===0?'Товар и размер':'Цены и сохранение'}</span></div><div class="progress-track"><div class="progress-fill" style="width:${(stage+1)*50}%"></div></div>${stage===0?`<div class="card stack"><div><div class="section-title">Категория</div>${catButtons(d)}</div><div><div class="section-title">Размер</div>${sizeButtons(d)}</div><button class="btn" data-action="hybrid-next">Продолжить →</button></div>`:`<div class="card stack"><div class="row"><div><div class="tiny">Выбранный товар</div><strong>${cat(d.category)[1]} ${cat(d.category)[2]} · ${safe(d.size)}</strong></div><button class="linkbtn" data-action="hybrid-back">Изменить</button></div><div class="two-inputs"><div>${textField('Закупка','cost',d,'1500',{prefix:'h'})}</div><div>${textField('На ценнике','tag',d,'2800',{prefix:'h'})}</div></div><div>${textField('Скидка, ₽','discount',d,'0',{prefix:'h',optional:true})}</div><div><label class="form-label" for="hybrid-note">Комментарий <span class="tiny">· необязательно</span></label><textarea id="hybrid-note" data-field="note" placeholder="Например, постоянный покупатель">${safe(d.note)}</textarea></div><div id="hybridPreview">${preview(d)}</div><div class="row"><button class="btn secondary small" data-action="hybrid-back">← Назад</button><button class="btn good" data-action="hybrid-save">✓ Записать</button></div></div>`}</div>`}
function checkDraftField(key,v){const d=st[st.tab+'Draft'];if(!d)return;d[key]=v;const area=document.getElementById(st.tab+'Preview');if(area)area.innerHTML=preview(d)}
function action(a,v,el){const d=st[st.tab+'Draft'];
if(a==='stats'){openSheet('overview');return}
if(a==='select-cat'&&d){d.category=v;rerenderPosition();return}
if(a==='select-size'&&d){d.size=v;rerenderPosition();return}
if(a==='form-save'){if(saveSale(st.formDraft,'form')){st.formDraft=emptyDraft();els.screen.scrollTop=0;render()}return}
if(a==='cash-field'){st.cashField=v;rerenderPosition();return}
if(a==='cash-next'){st.cashField=st.cashField==='cost'?'tag':st.cashField==='tag'?'discount':'cost';rerenderPosition();return}
if(a==='cash-key'){let old=String(st.cashDraft[st.cashField]);if(v==='C')old='';else if(v==='⌫')old=old.slice(0,-1);else if(v===','){if(!old.includes(',')&&!old.includes('.'))old=(old||'0')+','}else {if(old==='0')old=v;else if(old.replace(/\D/g,'').length<9)old+=v;}st.cashDraft[st.cashField]=old;rerenderPosition();return}
if(a==='cash-save'){if(saveSale(st.cashDraft,'cash')){st.cashDraft=emptyDraft();st.cashField='cost';els.screen.scrollTop=0;render()}return}
if(a==='hybrid-next'){if(!st.hybridDraft.category)return toast('Выберите категорию');if(!st.hybridDraft.size)return toast('Выберите размер или «Нет»');st.hybridStep=1;els.screen.scrollTop=0;render();return}
if(a==='hybrid-back'){st.hybridStep=0;els.screen.scrollTop=0;render();return}
if(a==='hybrid-save'){if(saveSale(st.hybridDraft,'hybrid')){st.hybridDraft=emptyDraft();st.hybridStep=0;els.screen.scrollTop=0;render()}return}
if(a==='chat-reset'){st.chatStep=0;st.chatLog=[];st.chatDraft=emptyDraft();render();return}
if(a==='chat-back'){if(st.chatStep>0){st.chatStep--;st.chatLog.pop();render()}return}
if(a==='chat-cat'){chatAdvance('category',v,cat(v)[1]+' '+cat(v)[2]);return}
if(a==='chat-size'){chatAdvance('size',v,v==='—'?'Без размера':v);return}
if(a==='chat-no-discount'){chatAdvance('discount','0','Без скидки');return}
if(a==='chat-note'){st.chatDraft.note=document.getElementById('chatNote')?.value||'';action('chat-save');return}
if(a==='chat-send'){const field=['','','cost','tag','discount'][st.chatStep];const textValue=document.getElementById('chatValue')?.value??'';const val=num(textValue);if(!Number.isFinite(val)||val<0||field==='tag'&&val<=0)return toast('Введите корректную сумму');if(field==='discount'&&val>num(st.chatDraft.tag))return toast('Скидка не может быть больше цены');chatAdvance(field,String(textValue),fmt(val));return}
if(a==='chat-save'){if(saveSale(st.chatDraft,'chat')){st.chatDraft=emptyDraft();st.chatStep=0;st.chatLog=[{role:'bot',text:'✅ Продажа записана! Можно сразу внести следующую.',time:nowTime()}];render()}return}
}
function rerenderPosition(){const top=els.screen.scrollTop;render();if(st.tab!=='chat')els.screen.scrollTop=top}
function chatAdvance(key,value,display){st.chatDraft[key]=value;st.chatLog.push({role:'user',text:display,time:nowTime()});st.chatStep++;render()}
function openSheet(which='overview'){st.sheet='open';st.sheetTab=which;st.editing='';renderSheet()}
function closeSheet(){st.sheet='';st.editing='';els.sheet.replaceChildren()}
function renderSheet(){if(!st.sheet){els.sheet.replaceChildren();return}let body='';if(st.editing){const s=sales.find(s=>s.id===st.editing);if(!s){st.editing='';return renderSheet()}body=`<div class="edit-grid"><div><label class="form-label">Категория</label><div class="field"><select id="edit-cat" style="background:transparent;border:0;outline:0;width:100%;font-size:14px">${CATS.map(c=>`<option value="${c[0]}" ${s.category===c[0]?'selected':''}>${c[1]} ${c[2]}</option>`).join('')}</select></div></div><div><label class="form-label">Размер</label><div class="field"><select id="edit-size" style="background:transparent;border:0;outline:0;width:100%;font-size:14px">${SIZES.map(sz=>`<option value="${safe(sz)}" ${s.size===sz?'selected':''}>${sz==='—'?'Нет':safe(sz)}</option>`).join('')}</select></div></div>${[['cost','Закупка, ₽'],['tag','На ценнике, ₽'],['discount','Скидка, ₽']].map(([k,label])=>`<div><label class="form-label" for="edit-${k}">${label}</label><div class="field"><input id="edit-${k}" inputmode="decimal" value="${s[k]}"><span class="suffix">₽</span></div></div>`).join('')}<div><label class="form-label" for="edit-note">Комментарий</label><textarea id="edit-note">${safe(s.note||'')}</textarea></div><button class="btn good" data-sheet="edit-save">Сохранить исправления</button><button class="btn secondary" data-sheet="edit-cancel">Отмена</button></div>`}else if(st.sheetTab==='overview'){const t=totals(today());const top=[...today()].sort((a,b)=>b.at.localeCompare(a.at))[0];body=`<div class="mini-summary"><div class="stat"><small>Продаж сегодня</small><strong>${t.count}</strong></div><div class="stat"><small>Выручка</small><strong>${fmt(t.revenue)}</strong></div><div class="stat"><small>Закупочная стоимость</small><strong>${fmt(t.cost)}</strong></div><div class="stat"><small>Валовая прибыль</small><strong style="color:${t.revenue-t.cost<0?'#bb4e56':'#148960'}">${fmt(t.revenue-t.cost)}</strong></div></div><div class="card"><div class="section-title">Скидки за день</div><strong>${fmt(t.discount)}</strong><div class="hint" style="margin-top:7px">Выручка и прибыль рассчитаны по фактической цене после скидки. Это не чистая прибыль: аренда, налоги и другие расходы здесь не учтены.</div></div>${top?`<div class="card" style="margin-top:10px"><div class="section-title">Последняя продажа</div><strong>${cat(top.category)[1]} ${cat(top.category)[2]} · ${safe(top.size)}</strong><div class="row" style="margin-top:8px"><span class="tiny">${new Date(top.at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</span><strong>${fmt(top.tag-top.discount)}</strong></div><button class="btn secondary small" style="margin-top:10px" data-sheet="edit" data-id="${safe(top.id)}">✎ Исправить</button></div>`:''}<div class="demo-foot">Демонстрационные записи помечены в журнале. Всё хранится только в этом браузере.</div>`}else{body=`${sales.length?sales.map(s=>`<div class="sale-item"><div class="main-line"><div><strong>${cat(s.category)[1]} ${cat(s.category)[2]} · ${safe(s.size)}</strong><div class="tiny" style="margin-top:4px">${new Date(s.at).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})} · ${new Date(s.at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})} ${s.demo?'· ДЕМО':''}</div></div><div class="amount">${fmt(s.tag-s.discount)}</div></div><div class="sub">Закупка ${fmt(s.cost)} · скидка ${fmt(s.discount)}<br>Валовая прибыль: ${fmt(s.tag-s.discount-s.cost)}${s.note?'<br>✎ '+safe(s.note):''}</div><div class="item-actions"><button type="button" data-sheet="edit" data-id="${safe(s.id)}">✎ Изменить</button><button type="button" class="danger" data-sheet="delete" data-id="${safe(s.id)}">Удалить</button></div></div>`).join(''):'<div class="empty">Записей пока нет.<br>Добавьте первую продажу в любом сценарии.</div>'}<div style="display:flex;gap:8px;margin-top:17px"><button class="btn secondary small" data-sheet="reset-demo">↻ Демо-примеры</button><button class="btn secondary small" data-sheet="clear">Очистить журнал</button></div><div class="demo-foot">Журнал общий для всех четырёх вариантов. Настоящая база данных не подключена.</div>`}
els.sheet.innerHTML=`<div class="sheet-backdrop" id="sheetBackdrop"><div class="sheet" role="dialog" aria-modal="true" aria-label="${st.editing?'Редактирование продажи':'Журнал и итоги'}"><div class="sheet-head"><div><h2>${st.editing?'Исправление продажи':'Продажи · демо'}</h2><div class="subtitle">${st.editing?'Изменения попадут в тестовый журнал':'Только данные этого браузера'}</div></div><button class="icon-btn" data-sheet="close" title="Закрыть" aria-label="Закрыть">✕</button></div>${!st.editing?`<div class="sheet-tabs"><button class="sheet-tab ${st.sheetTab==='overview'?'active':''}" data-sheet="overview">Итоги</button><button class="sheet-tab ${st.sheetTab==='history'?'active':''}" data-sheet="history">Журнал (${sales.length})</button></div>`:''}<div class="sheet-content">${body}</div></div></div>`}
function sheetAction(a,id){if(a==='close'){closeSheet();return}if(a==='overview'||a==='history'){st.sheetTab=a;renderSheet();return}if(a==='edit'){st.editing=id;renderSheet();return}if(a==='edit-cancel'){st.editing='';renderSheet();return}if(a==='edit-save'){const record=sales.find(s=>s.id===st.editing);if(!record)return;const d={category:document.getElementById('edit-cat').value,size:document.getElementById('edit-size').value,cost:document.getElementById('edit-cost').value,tag:document.getElementById('edit-tag').value,discount:document.getElementById('edit-discount').value,note:document.getElementById('edit-note').value};const err=validate(d);if(err){toast('⚠️ '+err);return}Object.assign(record,{category:d.category,size:d.size,cost:num(d.cost),tag:num(d.tag),discount:num(d.discount),note:d.note,demo:false});persist();st.editing='';renderSheet();render();toast('✓ Запись исправлена');return}
if(a==='delete'){if(!confirm('Удалить эту продажу из демонстрационного журнала?'))return;sales=sales.filter(s=>s.id!==id);persist();renderSheet();render();toast('Запись удалена');return}
if(a==='clear'){if(!confirm('Полностью очистить демонстрационный журнал?'))return;sales=[];persist();renderSheet();render();toast('Журнал очищен');return}
if(a==='reset-demo'){if(!confirm('Заменить ВСЕ текущие записи тремя демонстрационными?'))return;sales=seed();persist();renderSheet();render();toast('Примеры восстановлены')}}
function switchTab(tab){if(!['chat','form','cash','hybrid'].includes(tab))return;st.tab=tab;els.screen.scrollTop=0;render()}
document.querySelector('.bottom-nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)switchTab(b.dataset.tab)});
els.screen.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)action(b.dataset.action,b.dataset.value,b)});
els.screen.addEventListener('input',e=>{const i=e.target.closest('[data-field]');if(i)checkDraftField(i.dataset.field,i.value)});
els.screen.addEventListener('focusin',e=>{if(e.target.id==='chatValue'&&st.tab==='chat'&&st.chatStep===4&&e.target.value==='0')e.target.select()});
els.screen.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='chatValue'){e.preventDefault();action('chat-send')}});
els.sheet.addEventListener('click',e=>{if(e.target.id==='sheetBackdrop'){closeSheet();return}const b=e.target.closest('[data-sheet]');if(b)sheetAction(b.dataset.sheet,b.dataset.id)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&st.sheet){closeSheet();return}if(st.tab!=='cash'||st.sheet||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(/^\d$/.test(e.key)){action('cash-key',e.key);e.preventDefault()}else if(e.key==='Backspace'){action('cash-key','⌫');e.preventDefault()}else if(e.key===','||e.key==='.'){action('cash-key',',');e.preventDefault()}else if(e.key==='Enter'){action('cash-next');e.preventDefault()}});
render();
})();
</script>
</body>
</html>
